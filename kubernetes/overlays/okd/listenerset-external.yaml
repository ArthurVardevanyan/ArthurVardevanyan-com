---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: arthurvardevanyan-com
  namespace: arthurvardevanyan-com
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: https-gateway-external
    namespace: openshift-ingress
  listeners:
    - name: https
      hostname: "arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-tenancy: external
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: arthurvardevanyan-com-cert
    - name: https-www
      hostname: "www.arthurvardevanyan.com"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-tenancy: external
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: arthurvardevanyan-com-cert
