---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arthurvardevanyan-com-cert
  namespace: arthurvardevanyan-com
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: arthurvardevanyan-com-cert
  duration: 1080h # 45d
  renewBeforePercentage: 50
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "arthurvardevanyan.com"
    - "www.arthurvardevanyan.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
