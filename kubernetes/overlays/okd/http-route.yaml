---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arthurvardevanyan
  namespace: arthurvardevanyan-com
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: arthurvardevanyan-com
      namespace: arthurvardevanyan-com
  hostnames:
    - arthurvardevanyan.com
    - www.arthurvardevanyan.com
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: arthurvardevanyan
          namespace: arthurvardevanyan-com
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
    - filters:
        - requestRedirect:
            port: 443
            scheme: https
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /
