apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arthurvardevanyan
  namespace: arthurvardevanyan-com
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arthurvardevanyan
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 110
