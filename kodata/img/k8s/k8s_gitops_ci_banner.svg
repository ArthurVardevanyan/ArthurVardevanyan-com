<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="512" viewBox="0 0 1536 512" role="img" aria-label="k8s-gitops-ci pipeline: pull request, changeset, single Go binary (lint, build, validate), unified report">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.9"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; fill-opacity: 0.08; stroke: #ffffff; stroke-opacity: 0.85; stroke-width: 3; }
      .chip { fill: #ffffff; fill-opacity: 0.14; stroke: #ffffff; stroke-opacity: 0.6; stroke-width: 2; }
      .bin { fill: #ffffff; fill-opacity: 0.04; stroke: #ffffff; stroke-opacity: 0.9; stroke-width: 3; stroke-dasharray: 14 9; }
      .flow { stroke: #ffffff; stroke-opacity: 0.9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 17px; text-anchor: middle; fill-opacity: 0.8; }
      .tag { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1536" height="512" fill="#354a5f"/>

  <!-- stage 1: PR / push -->
  <rect class="box" x="90" y="300" width="190" height="130" rx="14"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <circle cx="160" cy="334" r="8"/><circle cx="160" cy="372" r="8"/><circle cx="212" cy="344" r="8"/>
    <path d="M160 342 V364"/><path d="M212 352 C212 366 190 364 168 372"/>
  </g>
  <text class="label" x="185" y="402">PR / Push</text>
  <text class="sub" x="185" y="423">forge event</text>

  <path class="flow" d="M284 365 H330"/>

  <!-- stage 2: changeset -->
  <rect class="box" x="334" y="300" width="190" height="130" rx="14"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <rect x="394" y="322" width="26" height="34" rx="3"/><rect x="428" y="322" width="26" height="34" rx="3"/>
    <path d="M400 332 H414 M400 340 H414 M434 332 H448 M434 340 H448"/>
  </g>
  <text class="label" x="429" y="388">Changeset</text>
  <text class="sub" x="429" y="410">affected overlays</text>

  <path class="flow" d="M528 365 H574"/>

  <!-- single binary -->
  <rect class="bin" x="578" y="262" width="640" height="206" rx="22"/>
  <text class="tag" x="602" y="292" fill-opacity="0.9">ONE GO BINARY · NO PVC</text>

  <!-- lint (fan-out) -->
  <rect class="chip" x="604" y="310" width="170" height="130" rx="12"/>
  <text class="label" x="689" y="345">Lint</text>
  <g font-size="15">
    <text class="sub" x="689" y="372" style="font-size:15px">prettier · shellcheck</text>
    <text class="sub" x="689" y="394" style="font-size:15px">markdownlint</text>
    <text class="sub" x="689" y="416" style="font-size:15px">golangci · kubeconform</text>
  </g>

  <path class="flow" d="M778 375 H812"/>

  <!-- build -->
  <rect class="chip" x="816" y="310" width="170" height="130" rx="12"/>
  <text class="label" x="901" y="345">Build</text>
  <rect x="836" y="358" width="130" height="30" rx="8" fill="#fff" fill-opacity="0.16"/>
  <text class="sub" x="901" y="380" style="fill-opacity:1">Kustomize</text>
  <rect x="836" y="396" width="130" height="30" rx="8" fill="#fff" fill-opacity="0.16"/>
  <text class="sub" x="901" y="418" style="fill-opacity:1">Helm · AVP</text>

  <path class="flow" d="M990 375 H1024"/>

  <!-- validate -->
  <rect class="chip" x="1028" y="310" width="170" height="130" rx="12"/>
  <text class="label" x="1113" y="345">Validate</text>
  <text class="sub" x="1113" y="376">schemas · policy</text>
  <text class="sub" x="1113" y="398">admission rules</text>
  <text class="sub" x="1113" y="420">CEL · exemptions</text>

  <path class="flow" d="M1222 365 H1268"/>

  <!-- report -->
  <rect class="box" x="1272" y="300" width="190" height="130" rx="14"/>
  <path d="M1336 324 h62 a8 8 0 0 1 8 8 v28 a8 8 0 0 1 -8 8 h-34 l-14 14 v-14 h-14 a8 8 0 0 1 -8 -8 v-28 a8 8 0 0 1 8 -8 z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1346 344 l7 7 l12 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1380 340 h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text class="label" x="1367" y="402">One Report</text>
  <text class="sub" x="1367" y="423">single PR comment</text>
</svg>
